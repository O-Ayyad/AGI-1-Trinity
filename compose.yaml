services:
  cli:
    build: .
    image: context-cli
    stdin_open: true
    tty: true
    restart: "no"
    environment:
      CLAUDE_BACKEND: ${CLAUDE_BACKEND:-api}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5}
      TRINITY_AGENT: ${TRINITY_AGENT:-coder}
    volumes:
      - context-data:/data
      # The Coder Agent can only touch files in here.
      - ./workspace:/workspace

volumes:
  context-data:
